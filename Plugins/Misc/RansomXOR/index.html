<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>File XOR Locker</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 750px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"], select { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            background: #111111;
        }

        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }

        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        .listview-container {
            border: 1px solid #ffffff;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        table.listview {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        table.listview th, table.listview td {
            padding: 8px 10px;
            border-bottom: 1px solid #333333;
        }
        table.listview th {
            background-color: #111111;
            color: #ffffff;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table.listview tr:hover {
            background-color: #111111;
        }

        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 120px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ File XOR Cryptor Module ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Initializing system controller... awaiting logs...
    </div>

    <div class="row">
        <div class="col form-group">
            <label>> Operation Mode</label>
            <select id="actionType">
                <option value="encrypt">Encrypt (XOR encryption)</option>
                <option value="decrypt">Decrypt (XOR decryption)</option>
            </select>
        </div>
        <div class="col form-group">
            <label>> XOR Secret Key</label>
            <input type="text" id="xorKey" value="secret_key_2026">
        </div>
    </div>

    <div class="form-group">
        <label>> Target File Path / Directory</label>
        <input type="text" id="targetPath" value="test.txt">
    </div>

    <div class="form-group">
        <button id="execBtn" onclick="executePlugin()" disabled>Execute XOR Operation</button>
    </div>

    <h3>Processed Files & Status View</h3>
    <div class="listview-container">
        <table class="listview" id="statusTable">
            <thead>
                <tr>
                    <th>File Path</th>
                    <th>Operation</th>
                    <th>Status</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="statusTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; color: #666666;">Awaiting execution...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <h3>Execution Console Log</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "ASP/Classic/OneShell",
            "ASHX/JScript/OneShell",
            "ASMX/JScript/OneShell",
            "ASPX/JScript/OneShell",
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/NebulaPulsar/DarkMatter",
            "ASPX/NebulaPulsar/DarkMatter",
            "PHP/v5.X/OneShell",
            "PHP/v7.X/OneShell",
            "PHP/v8.X/OneShell",
            "JSP/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter"
        ]
    };

    let currentShellType = "";

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }

            consoleOutput.appendChild(div);
        });

        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const execBtn = document.getElementById('execBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: XOR CRYPTOR READY`;
                    execBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED.");
                    appendLog("[*] READY TO PERFORM FILE XOR ENCRYPTION/DECRYPTION.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. MODULE REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. CORE OVERRIDE RE-ROUTE REQUIRED.");
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    function updateListView(results) {
        const tbody = document.getElementById('statusTableBody');
        tbody.innerHTML = "";

        if (!Array.isArray(results) || results.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666666;">No results found</td></tr>`;
            return;
        }

        results.forEach(res => {
            const tr = document.createElement('tr');
            const isSuccess = (res.status === "success" || res.success === true);
            const statusColor = isSuccess ? "#2ecc71" : "#e74c3c";
            const statusText = isSuccess ? "COMPLETED" : "FAILED";

            tr.innerHTML = `
                <td>${escapeHtml(res.file)}</td>
                <td>${escapeHtml(res.action || 'XOR')}</td>
                <td style="color: ${statusColor}; font-weight: bold;">${statusText}</td>
                <td>${escapeHtml(res.details || '')}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function executePlugin() {
        const actionType = document.getElementById('actionType').value;
        const xorKey = document.getElementById('xorKey').value;
        const targetPath = document.getElementById('targetPath').value;

        const config = {
            action: actionType,
            key: xorKey,
            target: targetPath
        };

        const jsonConfig = JSON.stringify(config);

        appendLog(`[*] ALLOCATING XOR PAYLOAD FOR: ${currentShellType.toUpperCase()} [Mode: ${actionType.toUpperCase()}]`);

        const bridge = window.chrome.webview.hostObjects.nativeBridge;
        const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
        
        const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
        appendLog('[*] EXECUTING REMOTE XOR FILE TRANSFORMATION...');
        
        const resultRaw = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
        
        appendLog('[+] RECEIVED EXECUTION RESULT FROM TARGET NODE.');

        try {
            let jsonString = resultRaw;
            if (jsonString.includes("[+] SUCCESS\n")) {
                jsonString = jsonString.substring(jsonString.indexOf("[+] SUCCESS\n") + 12);
            } else if (jsonString.startsWith("[+] SUCCESS")) {
                jsonString = jsonString.replace("[+] SUCCESS", "").trim();
            }

            const results = JSON.parse(jsonString);
            appendLog("[*] PARSED RESULT MATRIX SUCCESSFULLY. UPDATING LISTVIEW...");
            
            if (Array.isArray(results)) {
                updateListView(results);
                appendLog(`[+] OPERATION COMPLETE.`);
            } else {
                appendLog("--- RAW OUTPUT ---");
                appendLog(resultRaw);
            }

        } catch (jsonErr) {
            appendLog("[!] PARSE NOTE: RECEIVED PLAIN TEXT RESPONSE.");
            appendLog("--- RAW OUTPUT ---");
            appendLog(resultRaw);
        }
    }
</script>

</body>
</html>
